<div class="movimientos-container">

  <!-- Navbar -->
  <nav class="navbar">
    <h1>GestroContable</h1>
    <div class="nav-links">
    </div>
  </nav>

  <!-- Contenido -->
  <div class="content">

    <div class="header">
      <h2 style="margin: 0 auto;">Movimientos — {{ negocios[0]?.nombre }}</h2>
    </div>

    <!-- Mensajes -->
    <div class="error-message" *ngIf="error">{{ error }}</div>
    <div class="exito-message" *ngIf="exito">{{ exito }}</div>

    <!-- Formulario -->
    <div class="formulario" style="margin: 0 auto 32px; max-width: 500px;">
      <h3>Registrar Movimiento</h3>

      <div class="form-group">
        <label>Monto</label>
        <input type="number" [(ngModel)]="nuevoMovimiento.monto" placeholder="0"/>
      </div>

      <div class="form-group">
        <label>Fecha y hora</label>
        <input type="date" [(ngModel)]="nuevoMovimiento.fecha"/>
      </div>

      <div class="form-group">
        <label>Hora</label>
        <input type="time" [(ngModel)]="nuevoMovimiento.hora"/>
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <input type="text" [(ngModel)]="nuevoMovimiento.descricion" placeholder="Descripción del movimiento"/>
      </div>

      <!-- Tipo de Movimiento -->
      <div class="form-group">
        <label>Tipo de Movimiento</label>
        <select [(ngModel)]="tipoNombre" (change)="onTipoChange()">
          <option value="">-- Selecciona --</option>
          <option value="INGRESO">Ingreso</option>
          <option value="EGRESO">Egreso</option>
          <option value="GASTO">Gasto</option>
        </select>
      </div>

      <!-- Naturaleza -->
      <div class="form-group">
        <label>Naturaleza</label>
        <select [(ngModel)]="naturaleza">
          <option value="">-- Selecciona --</option>
          <option value="DEBITO">Débito</option>
          <option value="CREDITO">Crédito</option>
        </select>
      </div>

      <!-- Origen -->
      <div class="form-group">
        <label>Nombre del Origen</label>
        <input type="text" [(ngModel)]="origenNombre" placeholder="Ej: Proveedor Juan"/>
      </div>

      <div class="form-group">
        <label>Tipo de Origen</label>
        <select [(ngModel)]="origenTipo">
          <option value="">-- Selecciona --</option>
          <option value="PROVEEDOR">Proveedor</option>
          <option value="TRABAJADOR">Trabajador</option>
          <option value="SERVICIO_PUBLICO">Servicio Público</option>
          <option value="FACTURA">Factura</option>
          <option value="CLIENTE">Cliente</option>
          <option value="OTRO">Otro</option>
        </select>
      </div>

      <div class="form-buttons">
        <button class="btn-guardar" (click)="registrar()">Guardar</button>
      </div>
    </div>

    <!-- Sin movimientos -->
    <div class="sin-movimientos" *ngIf="movimientos.length === 0 && idNegocioSeleccionado">
      <p>No hay movimientos registrados para este negocio.</p>
    </div>

  </div>
</div>
