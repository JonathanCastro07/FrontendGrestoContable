<div class="auth">

  <app-auth-panel></app-auth-panel>

  <main class="auth-lado">
    <div class="auth-card">

      <h1>¡Qué bueno tenerte de vuelta!</h1>
      <p class="auth-sub">Inicia sesión para continuar</p>

      <div class="error-message" *ngIf="error">{{ error }}</div>

      <form (ngSubmit)="iniciarSesion()" novalidate>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input id="correo" name="correo" type="email" autocomplete="email"
                 [(ngModel)]="correo" placeholder="tucorreo@gmail.com"/>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input id="password" name="password" autocomplete="current-password"
                   [type]="verPassword ? 'text' : 'password'"
                   [(ngModel)]="password" placeholder="••••••••"/>
            <button type="button" class="ojo" (click)="verPassword = !verPassword"
                    [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg *ngIf="!verPassword" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="verPassword" viewBox="0 0 24 24"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 8 10 8a17.6 17.6 0 0 1-2.16 3.19M6.61 6.61A17.5 17.5 0 0 0 2 12s3.5 8 10 8a9.7 9.7 0 0 0 5.39-1.61"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
        </div>

        <button class="btn-login" type="submit" [disabled]="cargando">
          {{ cargando ? 'Ingresando…' : 'Iniciar sesión' }}
        </button>
      </form>

      <p class="auth-link">
        ¿No tienes cuenta?
        <a routerLink="/registro">Regístrate aquí</a>
      </p>

    </div>
  </main>

</div>
